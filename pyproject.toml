[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termvault"
dynamic = ["version"]
description = "A local-first terminal knowledge base for developers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "TermVault Contributors" },
]
keywords = ["cli", "terminal", "knowledge-base", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "textual>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
tv = "termvault.cli:run"

[tool.hatch.version]
path = "termvault/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["termvault"]

[tool.hatch.build.targets.wheel.force-include]
"termvault/tui/styles.tcss" = "termvault/tui/styles.tcss"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
